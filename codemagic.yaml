# Codemagic 配置 — 小石榴 Flutter 项目
# codemagic.yaml 放在仓库根目录，working_directory 指向 Flutter 项目子目录

workflows:
  # ---------------------------------------------------------------
  # iOS 模拟器包（无签名，无需 Apple 账号，先看 UI 效果）
  # ---------------------------------------------------------------
  ios-simulator:
    name: iOS Simulator Preview
    working_directory: flutter-project
    max_build_duration: 30
    environment:
      flutter: 3.24.5
      xcode: 16.2
      cocoapods: default
      vars:
        CM_BUILD_TYPE: release
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app.zip
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # Android Release APK（arm64 + arm，体积小）
  # ---------------------------------------------------------------
  android-apk:
    name: Android APK Release
    working_directory: flutter-project
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      vars:
        CM_BUILD_TYPE: release
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build apk --release --target-platform android-arm64,android-arm
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # iOS 真机 IPA（需要 Apple 开发者账号 + 签名证书）
  # ---------------------------------------------------------------
  ios-ipa:
    name: iOS IPA Release
    working_directory: flutter-project
    max_build_duration: 90
    environment:
      flutter: 3.24.5
      xcode: 16.2
      cocoapods: default
      vars:
        CM_BUILD_TYPE: release
        # 必须与 Xcode 工程里的 PRODUCT_BUNDLE_IDENTIFIER 一致
        BUNDLE_ID: com.xiaoshiliu.xiaoshiliuApp
      ios_signing:
        distribution_type: app_store
        certificate_id: ${IOS_CERTIFICATE_ID}
        profile_id: ${IOS_PROFILE_ID}
    scripts:
      - flutter --version
      - flutter pub get
      # Podfile 已随仓库提交，flutter build ipa 会自动执行 pod install
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
