# Codemagic 配置 — 小石榴 Flutter 项目
# codemagic.yaml 放在仓库根目录，working_directory 指向 Flutter 项目子目录

workflows:
  # ---------------------------------------------------------------
  # iOS 模拟器包（无签名，无需 Apple 账号，先看 UI 效果）
  # ---------------------------------------------------------------
  ios-simulator:
    name: iOS Simulator Preview
    working_directory: flutter-project
    max_build_duration: 30
    environment:
      flutter: 3.24.5
      xcode: 16.2
      cocoapods: default
      vars:
        CM_BUILD_TYPE: release
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app.zip

  # ---------------------------------------------------------------
  # Android Release APK（arm64 + arm，体积小）
  # ---------------------------------------------------------------
  android-apk:
    name: Android APK Release
    working_directory: flutter-project
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      vars:
        CM_BUILD_TYPE: release
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build apk --release --target-platform android-arm64,android-arm
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # ---------------------------------------------------------------
  # iOS 真机 IPA（需要 Apple 开发者账号 + 签名证书）
  # 在 Codemagic 后台 Team settings → Code signing 里上传：
  #   - Code signing identities → iOS certificates：上传 .p12（带私钥）
  #   - iOS provisioning profiles：上传 .mobileprovision
  # ---------------------------------------------------------------
  ios-ipa:
    name: iOS IPA Release
    working_directory: flutter-project
    max_build_duration: 90
    environment:
      flutter: 3.24.5
      xcode: 16.2
      cocoapods: default
      vars:
        CM_BUILD_TYPE: release
        # 必须与 Xcode 工程里的 PRODUCT_BUNDLE_IDENTIFIER 一致
        BUNDLE_ID: com.xiaoshiliu.xiaoshiliuApp
      ios_signing:
        # 按分发类型 + Bundle ID 自动匹配已上传的证书和描述文件，
        # 不需要手填 certificate_id / profile_id
        distribution_type: app_store
        bundle_identifier: com.xiaoshiliu.xiaoshiliuApp
    scripts:
      - flutter --version
      - flutter pub get
      # 把 ios_signing 里匹配到的证书/描述文件装进钥匙串并生成 ExportOptions
      - xcode-project use-profiles
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
