# Codemagic 配置 — 小石榴 Flutter 项目
# 在 Codemagic 创建 App 关联 Git 仓库后，选对应 workflow 即可触发构建。
# codemagic.yaml 放在仓库根目录，project_name 指定 Flutter 项目所在子目录。

project_name: XiaoShiLiu
workflows:
  # ---------------------------------------------------------------
  # iOS 模拟器包（无签名，无需 Apple 账号，先看 UI 效果）
  # Codemagic 会自动把 .app 打包成 .app.zip
  # ---------------------------------------------------------------
  ios-simulator:
    name: iOS Simulator Preview
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: 15.4
      cocoapods: default
      vars:
        CM_BUILD_TYPE: release
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app.zip
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # Android Release APK（arm64 + arm，体积小）
  # ---------------------------------------------------------------
  android-apk:
    name: Android APK Release
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        CM_BUILD_TYPE: release
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build apk --release --target-platform android-arm64,android-arm
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # iOS 真机 IPA（需要 Apple 开发者账号 $99/年 + 签名证书）
  # 自动签名：在 Codemagic Team Settings 关联 App Store Connect
  # 手动签名：在 Code Signing 上传 .p12 + .mobileprovision
  # ---------------------------------------------------------------
  ios-ipa:
    name: iOS IPA Release
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: 15.4
      cocoapods: default
      vars:
        CM_BUILD_TYPE: release
        BUNDLE_ID: com.xiaoshiliu.xiaoshiliu-app
      automatic_signing_options:
        - team_id: YOUR_TEAM_ID
          bundle_identifier: com.xiaoshiliu.xiaoshiliu-app
          profile_type: AppStore
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
