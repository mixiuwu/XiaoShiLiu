# Codemagic 配置 — 小石榴 Flutter 项目
# 文档：https://docs.codemagic.io/yaml/yaml-getting-started/
# 在 Codemagic 创建 App 关联 Git 仓库后自动生效。
workflows:
  # ---------------------------------------------------------------
  # Android —— 出 APK（debug / release） 或 AAB（上架 Google Play）
  # ---------------------------------------------------------------
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      sdk: default
      flutter: stable
      vars:
        # 可选：用 dart-define 覆盖 API 地址（默认已指向线上 https://git.aodde.com）
        # API_BASE: https://git.aodde.com
        CM_BUILD_TYPE: release
      xcode: latest
      cocoapods: default
    scripts:
      - flutter --version
      - flutter pub get
      # release APK（arm64 + arm，小体积，约 15~20MB）
      - flutter build apk --release --target-platform android-arm64,android-arm
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      # 可选：自动发送到 Google Play / 邮件 / Slack
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  android-aab:
    name: Android AAB (Google Play)
    max_build_duration: 60
    environment:
      sdk: default
      flutter: stable
      vars:
        CM_BUILD_TYPE: release
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  # ---------------------------------------------------------------
  # iOS —— 出 IPA（Ad Hoc / App Store）
  # 需要在 Codemagic 上传 Apple 证书（.p12 + .mobileprovision）
  # 或启用自动签名（需要 Team ID）
  # ---------------------------------------------------------------
  ios-ipa:
    name: iOS IPA
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: 15.4
      cocoapods: default
      vars:
        CM_BUILD_TYPE: release
        BUNDLE_ID: com.xiaoshiliu.xiaoshiliu-app
      # 手动签名：从 Codemagic 账户上传证书后引用文件名
      # signing:
      #   ios:
      #     certificate: AppleDistributionCert.p12
      #     password: $CM_KEYSTORE_PASSWORD
      #     profiles:
      #       - AppStore_Profile.mobileprovision
      # 或者自动签名（推荐，只需 Team ID）
      automatic_signing: true
      automatic_signing_options:
        - team_id: YOUR_TEAM_ID
          bundle_identifier: com.xiaoshiliu.xiaoshiliu-app
          profile_type: AppStore
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build ios --release --no-codesign
      # 下面两步 Codemagic 会自动处理（codesign + xcodebuild archive/export）
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
      # 也可以自动上传到 TestFlight / App Store Connect
      # app_store_connect:
      #   api_key: APP_STORE_CONNECT_API_KEY
      #   app_id: 0000000000

  ios-simulator:
    name: iOS Simulator (无签名，QA 测试)
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - flutter --version
      - flutter pub get
      - flutter build ios --simulator
    artifacts:
      - build/ios/iphonesimulator/*.app.zip
