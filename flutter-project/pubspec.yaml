name: xiaoshiliu_app
description: "小石榴 - 深色霓虹短视频社区 APP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  # 网络
  dio: ^5.5.0
  # 路由
  go_router: ^14.2.0
  # 存储
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # 视频播放
  video_player: ^2.9.1
  # 图片
  cached_network_image: ^3.4.0
  flutter_svg: ^2.0.10+1
  # 素材选择
  image_picker: ^1.1.2
  # 工具
  intl: ^0.19.0

  # 投屏（DLNA/UPnP，纯 Dart，无需 Google Play 服务）
  # 0.0.9+ 要求 Dart>=3.8，本项目锁 Dart 3.5.4，故钉 0.0.8
  dlna_dart: 0.0.8
  volume_controller: ^3.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/vip/
